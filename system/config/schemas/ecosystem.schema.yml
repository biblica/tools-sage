schema_id: sage-ecosystem-0.04
required:
  ecosystem: [schema_version, id, name, configured]
  paths: [internal_scripture_root, base_vrs_root, cache_root, runtime_state_root]
  versification: [canonical_file, base_files, custom_file_default]
  language_profiles: mapping_keyed_by_canonical_language_tag
  projects: mapping
  workflows: [bic, saw]
  human_output: [operator_language, operator_language_policy, logs_and_reports, translation_challenges, machine_records]
optional:
  versification: [default_file]
  interface: [language, menu_localization_source]
  project_resource_mount: [external_path, external_access_mode]
  setup_guidance: [canonical_surface, normal_launch, windows_launch, setup_surface, provider_surface, manual_recalibration, recovery_surface]
  workflow_project_paths: [memory_root, publication_root]
  evaluation_sets: mapping
  project_codes: mapping
constraints:
  ecosystem.id: sage
  ecosystem.schema_version: '0.04'
  every_file_reference_includes_extension: true
  vrs_filenames_end_with_case_insensitive: .vrs
  extensionless_vrs_aliases: prohibited
  language_profile_key: canonical_bcp47_tag
  language_profile_alias: migration_only_legacy_namespace_reference_with_matching_script
  project_language_code_must_match_profile: true
  project_path: relative_directory_not_file
  project_external_path: absolute_Paratext_or_PTLite_project_folder
  external_read_extensions_case_insensitive: [.sfm, .vrs]
  external_access_modes: [READ_ONLY_SCRIPTURE, READ_WRITE_SCRIPTURE, READ_WRITE_TARGET]
  READ_WRITE_SCRIPTURE: project_inventory_maximum_capability_only
  READ_WRITE_TARGET_allowed_only_for: effective_BIC_GENERATED_TARGET_job_binding
  external_vrs_writes: prohibited
  base_vrs_root: configurable_directory
  base_vrs_resolution: project_local_then_configured_base_vrs_root
  default_project_vrs: eng.vrs_unless_project_or_operator_declares_another_base
  custom_vrs: inside_own_project_root
  project_scope: compatible_canon_testament_expected_books_roles
  project_content_state: required_LOCKED_or_UNDER_REVIEW
  sage_project_roles: job_scoped_only
  effective_project_roles: explicit_from_job_bindings_never_inferred_from_project_code
  auto_resolution: reported_during_INIT_without_rewriting_source_yaml
  project_code_grammar: lowercase_language_code_plus_uppercase_project_abbreviation_plus_lowercase_type_plus_iteration_digit_max_8_chars
  project_code_type_does_not_imply_workflow_role: true
  iteration_and_scripture_scope_are_independent: true
  evaluation_execution: sequential_single_output_project_tasks

human_output_contract:
  operator_language:
    scope: global
    default: en
    purpose: primary_language_for_operator_facing_logs_and_reports
  operator_language_policy:
    approved: [en]
    candidates: [id, fr, es, pt-BR, pt-PT, ru]
    operational_priorities: [id, fr]
    operational_priorities_must_be_candidates: true
    pilot_only: [hi-Deva, th, fil, tl, sw, ha-Latn]
    normal_menu_selection: approved_plus_candidates
    pilot_menu_visibility: prohibited
    pilot_promotion: advanced_operator_manually_adds_tag_to_candidates
    canonical_fallback_en_must_remain_approved: true
  secondary_reporting_language:
    scope: per_job
    path: jobs/<tool>/<job-id>/job.yml
    cardinality: zero_or_one
    authority_notice: required_in_every_bilingual_human_report
    primary_authority: governing_human_rendering
    secondary_authority: assistive_translation_only
    secondary_confidence: lower_unverified_translation_confidence
    secondary_generation_cost: additional_model_usage_and_compilation_time
    secondary_review_requirement: greater_than_single_language_report
    canonical_machine_evidence: authoritative
  per_project_reporting_override: prohibited
  logs_and_reports:
    primary_language: OPERATOR_LANGUAGE
    optional_secondary_language: job_reporting.secondary_language
    verbosity_values: [quiet, normal, verbose, debug]
  translation_challenges:
    primary_language: OPERATOR_LANGUAGE
    optional_secondary_language: job_reporting.secondary_language
    minimum_individual_urgency: 0-4
    aggregate_lower_levels: true
    consolidate_repeated_cause: true
  machine_records:
    language: canonical
    localise_codes: false

interface_contract:
  scope: workstation_setup
  language_owner: system_interface_only
  reporting_language_authority: prohibited
  default_language: en-US
  supported_languages: [en-US, en-GB, id, fr, ru, pt-BR]
  localization_source: system/config/localization/menu-localization.json
  visible_operation_keys: numerals_only
  footer_controls:
    A: BACK
    B: MAIN_MENU
    C: EXIT_SAGE
    D: INTERFACE_LANGUAGE
  footer_control_keys_are_language_neutral: true
  localized_labels_must_not_control_navigation: true
