[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tools-sage"
version = "0.02alpha1"
description = "SAGE 0.02 Alpha 1 with STC, routed-SFM sizing, governed linguistic profiles, and an experimental unstable Textual TUI"
requires-python = ">=3.10"
dependencies = [
  "certifi==2026.7.22",
  "openpyxl==3.1.5",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
tui = ["textual==8.2.8"]

[project.scripts]
sage = "sage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "source_release: source-package-only hygiene and deterministic builder tests",
]
