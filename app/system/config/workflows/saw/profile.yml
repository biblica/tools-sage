workflow:
  id: saw
  name: Scripture Analysis Workbench
  purpose: Read-only analysis of one LWC work-in-progress translation against one
    configured LWC Reference Project and bounded original-language evidence only when routed.
  qualification_status: VALIDATED
  baseline_version: A0002-r6
  execution_model: SAGE_GOVERNED_TASK_V1
bindings: {}
rtc_sizing:
  provider: codex
  estimator: SAGE_MULTILINGUAL_HEURISTIC_1
  wip_target_min_tokens: 6000
  wip_target_max_tokens: 7000
  wip_hard_exclusive_tokens: 8000
  route_hard_max_tokens: 32000
  route_hard_serialized_bytes: 224000
evidence_policies:
  default:
    target_estimated_tokens: 18000
    hard_estimated_tokens: 28000
    hard_serialized_bytes: 196000
    minimum_target_tokens: 6000
    maximum_primary_verse_units: 220
    context_before_verses: 1
    context_after_verses: 1
    allow_cross_chapter_units: true
  rtc:
    target_estimated_tokens: 28000
    hard_estimated_tokens: 32000
    hard_serialized_bytes: 224000
    minimum_target_tokens: 6000
    maximum_primary_verse_units: 220
    maximum_primary_discourse_units: 0
    preferred_primary_discourse_units: 4
    context_before_verses: 1
    context_after_verses: 1
    allow_cross_chapter_units: true
  stc:
    target_estimated_tokens: 12000
    hard_estimated_tokens: 18000
    hard_serialized_bytes: 126000
    minimum_target_tokens: 3500
    maximum_primary_verse_units: 120
    maximum_primary_discourse_units: 0
    context_before_verses: 1
    context_after_verses: 1
    allow_cross_chapter_units: true
  focused:
    target_estimated_tokens: 12000
    hard_estimated_tokens: 18000
    hard_serialized_bytes: 126000
    minimum_target_tokens: 3500
    maximum_primary_verse_units: 120
    maximum_primary_discourse_units: 2
    context_before_verses: 2
    context_after_verses: 2
    allow_cross_chapter_units: true
  ol:
    target_estimated_tokens: 9000
    hard_estimated_tokens: 14000
    hard_serialized_bytes: 98000
    minimum_target_tokens: 2500
    maximum_primary_verse_units: 60
    maximum_primary_discourse_units: 1
    context_before_verses: 2
    context_after_verses: 2
    allow_cross_chapter_units: true
check_policy:
  version: "1.0"
  rtc:
    checks:
      structure_completeness: true
      translation_meaning: true
      language_readability: true
      consistency: true
    usfm_contexts:
      add:
        markers: [add]
        mode: MATERIAL_ONLY
      nd:
        markers: [nd]
        mode: MATERIAL_ONLY
      f:
        markers: [f]
        mode: STRUCTURE_ONLY
      x:
        markers: [x]
        mode: NORMAL
    original_language:
      source_text_drift_adjudication: PROHIBITED
      # New RTC tasks seal SAW_OL_REFERRAL_ADMISSION_V1 in their manifests.
      # The runtime admits only closed-class, fundamental, unresolved source conflicts
      # and creates exactly one isolated selective task per admitted request.

permissions:
  may_write_projects: []
  may_write_target: false
  may_write_reference: false
  may_write_original_language: false
  may_write_bic_memory: false
state_model:
  operation_states:
  - NOT_RUN
  - READY
  - IN_PROGRESS
  - COMPLETE
  - STALE
  - BLOCKED
  - ERROR
  - ABANDONED
qualification_gates:
- operation_skills_registered_and_hashed
- source_prompt_traceability_validated
- provider_neutral_governed_task_contracts
- fresh_initialization_and_resource_readiness
- exact_wip_and_reference_bindings
- project_bound_original_language_only
- immutable_task_manifest_and_act_prompt
- bounded_hashed_read_allowlist
- exact_traversal_safe_write_allowlist
- deterministic_preflight_and_vrs_evidence
- structural_candidate_reconciliation
- complete_coordinate_coverage
- schema_validated_findings_and_deterministic_reports
process:
  stages:
  - DETERMINISTIC_PREFLIGHT
  - STRUCTURAL_ADJUDICATION
  - REFERENCE_TEXT_COMPARISON
  - SELECTIVE_OL_ADJUDICATION
  - COVERAGE_RECONCILIATION
  - DETERMINISTIC_FINALISATION
  rules:
  - Each task analyzes one WIP translation against one authorized REFERENCE.
  - Every expected coordinate and structural candidate is reconciled.
  - Scripture projects remain read-only; findings and reports are generated deterministically.
  - Reference Text Comparison (RTC) structural and meaning stages do not route OL Scripture.
  - >-
    Reference Text Comparison (RTC) governs the original WIP slice within the routed
    WIP+REFERENCE SFM review item: target about 6000 estimated WIP tokens, prefer natural discourse
    boundaries in the 5000-7000 range, and never plan a WIP slice at 8000 tokens or above.
    The REFERENCE follows the exact same Scripture range. The complete routed RTC SFM review item is
    soft-targeted below 28000 estimated tokens and hard-stopped at 32000; crossing the hard guard
    requires reslicing, not a larger review item. Prose prefers section/pericope then paragraph boundaries.
    Poetry preserves whole Psalm/song units and operational stanzas formed by consecutive q/qN
    lines; q-level indentation changes do not create stanza boundaries. Colon/clause splitting is
    emergency-only when a protected stanza itself cannot fit. Targeted Check limits each primary
    evaluation to at most two intact discourse units, and standalone Original-Language Review to
    one. Adjacent context-only evidence remains labeled and excluded from coverage/findings.
  - Option 11 automatically adjudicates material WIP-Reference source-dependent variances;
    it routes OT only to Job-bound Hebrew and NT only to Job-bound Greek. It remains distinct
    from standalone Original-Language Review, which requires an explicit bounded question and
    performs the detailed OL check.
  - SAW final note material is plain Operator text; SAGE never creates or modifies
    Paratext Notes XML.
