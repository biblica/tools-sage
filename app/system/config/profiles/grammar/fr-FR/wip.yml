checks:
- id: FRFR-GR-001
  dimension: meaning
  review: Check that the bounded wording preserves the complete proposition, participant relations, and logical
    connection.
  caution: Report uncertainty; do not approve or rewrite automatically.
- id: FRFR-GR-002
  dimension: participant_reference
  review: Check explicit and implicit participant references, including pronouns, omitted arguments, and antecedents
    across the bounded discourse unit.
  caution: Do not infer an antecedent that the project evidence does not support.
- id: FRFR-GR-003
  dimension: morphology_and_agreement
  review: Check inflection, agreement, case or relational marking, number, gender/class, person, and other language-relevant
    morphology where it affects interpretation or naturalness.
  caution: Treat plausible alternatives as project-review questions when bounded evidence does not decide between
    them.
- id: FRFR-GR-004
  dimension: verb_form
  review: Check tense, aspect, mood, voice, polarity, agreement, auxiliaries, and other language-relevant verb choices
    in context.
  caution: Do not replace a form merely because another form is more frequent outside the project.
- id: FRFR-GR-005
  dimension: word_order_and_information_structure
  review: Check constituent order against focus, emphasis, quotation structure, and discourse flow in the bounded
    passage.
  caution: Treat marked order as potentially meaningful until project evidence resolves it.
- id: FRFR-GR-006
  dimension: clause_structure
  review: Check coordination, subordination, negation, ellipsis, clause linkage, and quotation boundaries for grammatical
    and discourse coherence.
  caution: Preserve logical and quotation relationships; do not normalize them silently.
- id: FRFR-GR-007
  dimension: terminology_and_lexical_form
  review: Check project terminology, inflected lexical forms, register, collocations, and consistency within the
    bounded scope.
  caution: Project-approved terminology takes precedence over general-language preference.
- id: FRFR-GR-008
  dimension: orthography_punctuation_and_regional_usage
  review: Check metropolitan French spelling, agreement, clitic placement, tense/mood, punctuation, spacing, quotation
    conventions, and idiomatic written syntax.
  caution: Do not impose France-specific lexical preferences when the project has approved another regional convention.
normalization:
