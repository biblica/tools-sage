schema_id: sage-act-task-2.4
required:
- schema_version
- execution_mode
- workflow
- operation
- job_id
- run_id
- resource_bindings
- output_project
- output_content_state
- contemporary_source
- original_language_sources
- scope
- skill
- project_grammar
- linguistic_profile_bindings
- evidence_policy
- packets
- resource_fingerprints
- expected_references
- structural_candidate_ids
- allowed_evidence_ids
- governance_inputs
- allowed_reads
- conditional_reads
- allowed_writes
- output_grammar
- human_output
- narrative_language
- forbidden_actions
- task_fingerprint
canonical_resource_bindings:
  bic:
    SOURCE: exactly_one
    DONOR: exactly_one
    TARGET: exactly_one
    ORIGINAL_LANGUAGE_GREEK: zero_or_one
    ORIGINAL_LANGUAGE_HEBREW: zero_or_one
  saw_job:
    WIP: exactly_one
    REFERENCE: exactly_one
    ORIGINAL_LANGUAGE_GREEK: zero_or_one
    ORIGINAL_LANGUAGE_HEBREW: zero_or_one
  saw_task_by_operation:
    rtc: [WIP, REFERENCE]
    stc: [WIP, exactly_one_testament_appropriate_PRIMARY_OL]
    focused: [WIP, REFERENCE]
    ol: [WIP, REFERENCE, exactly_one_testament_appropriate_PRIMARY_OL]
resource_projection_fields:
  output_project: BIC_TARGET_or_SAW_WIP
  contemporary_source: BIC_SOURCE_or_SAW_REFERENCE
  rule: canonical_resource_bindings_are_authoritative_for_model_and_project_role_semantics
project_context:
  job_id: required_for_all_governed_tasks
  run_id: required_for_all_governed_tasks
  direct_cli: must_resolve_or_create_persisted_job_and_run
controls:
  schema_version: '2.4'
  execution_mode: SAGE_GOVERNED_TASK_V1
  output_project_projection:
    cardinality: exactly_one
    object: BIC_TARGET_or_SAW_WIP
  contemporary_source_projection:
    cardinality: exactly_one
    object: BIC_SOURCE_or_SAW_REFERENCE
  original_language_sources:
    cardinality: exactly_one
    object: applicable_bound_ol_resource
    condition: direct_or_conditionally_authorised
    otherwise: none
  conditional_original_language_reads: material_semantic_risk_level_2_with_trigger
  scope_packet: exact_bounded_coordinates
  partition_context:
    routing: adjacent_WIP_and_REFERENCE_packets
    mode: CONTEXT_ONLY
    ordinary_finding_target: prohibited
  governance_input_allowlist: exact_hashed_controller_files_not_routed_to_model
  read_allowlist: exact_hashed_model_files_with_required_evidence_class
  evidence_policy: canonical_closed_local_evidence_policy_required
  external_content_knowledge: prohibited
  general_linguistic_competence: orthography_morphology_grammar_syntax_only
  write_allowlist: exact_fixed_output_paths
  task_manifest: immutable_and_hashed_outside_task_directory
  act_prompt: immutable_and_hashed_outside_task_directory
  task_fingerprint: recomputed_at_submission
  context_budget:
    planning_basis: ROUTED_SFM_ONLY
    sizing_inputs: only_SFM_physically_routed_for_the_review_item
    excluded_from_sizing: [prompt, schema, controller_json, microtransactions, profiles, ids, hashes, diagnostics]
    provider_transport: byte_telemetry_only
    discourse_quality_guard: protected_discourse_units_are_never_split_only_to_reduce_tokens
  settings_fingerprint: must_match_initialization_and_submission
  submit_command_required: true
  resubmission: prohibited
  job_isolation: all_governed_tasks_have_persisted_job_id_and_run_id
  narrative_language:
    cardinality: exactly_one
    owner: job_reporting.primary_language
    authority: CANONICAL_REPORT_NARRATIVE
    provider_binding: explicit_tag_and_language_name
    source_language_inference: prohibited
    interface_language_in_provider_prompt: prohibited
    secondary_language_in_canonical_provider_prompt: prohibited
    clear_mismatch_retry: at_most_one
  human_output_language_authority:
    bilingual_reports: required
    primary_job_language: governing_human_rendering
    secondary_language: assistive_lower_confidence_translation
    secondary_generation_cost: additional_model_usage_and_compilation_time
    secondary_review_requirement: greater_than_single_language_report
    canonical_machine_evidence: authoritative
  pre_release_migration: prohibited
  effective_vrs:
    cardinality: exactly_one
    object: resolved_schema
    scope: per_governed_resource_context
rtc_composite_stages:
- STRUCTURAL_ADJUDICATION
- REFERENCE_TEXT_COMPARISON
- SELECTIVE_OL_ADJUDICATION

linguistic_profile_bindings_contract:
  every_natural_language_stream: exactly_one_complete_canonical_profile
  project_stream_profile_class: LANGUAGE_PROFILE
  original_language_stream_profile_class: OL_AUTHORITY_PROFILE
  provider_language_inference: prohibited
  profiles_are_immutable: true
  profiles_are_sliced: false
  profiles_affect_sfm_sizing: false
