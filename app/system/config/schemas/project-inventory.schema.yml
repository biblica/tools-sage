schema_id: sage-project-inventory-1.0
required: [schema_version, projects]
controls:
  schema_version: '1.0'
  owner: operator_state
  path: localdata/.system/state/project-inventory.json
  project_key: canonical_Paratext_or_PTLite_folder_code
  addition_to_sage:
    role_neutral: true
    discovery_source: localdata/.system/state/paratext-project-catalog.json
    discovery_gate: valid_settings.xml
    declared_books_from: operator_confirmed_scope_with_canons.xml_proposal_when_available
    actual_scripture_from: readable_top_level_SFM_id_markers
    vrs_only_folder_is_project: false
    scope_derived_from_discovered_books: proposed_when_canons.xml_is_unavailable
    workflow_role_inferred_from_project_code: false
    original_language_aliases_are_separate: true
  project_record:
    required: [project_id, display_name, language, format, kind, content_state, scope, detected_books, scope_summary, versification, code_metadata, validation_status]
    optional:
      paratext_metadata: [full_name, language_name, language_iso, language_iso_raw, catalog_status]
      sfm_books: actual_SFM_inventory
  reporting:
    language_configuration_owner: job_not_project
    project_reporting_fields: prohibited
  access:
    stored_separately: localdata/.system/state/resource-mounts.json
    maximum_capability: [READ_ONLY_SCRIPTURE, READ_WRITE_SCRIPTURE]
    effective_target_write: assigned_only_in_BIC_job_runtime
