schema_id: sage-language-profile-registry-v2
purpose: Route project-bound language guidance by canonical language tag and optional role variant.
namespace_key: canonical_bcp47_language_tag
required_per_concrete_namespace:
  - script
  - variants
required_per_alias_namespace:
  - script
  - profile_alias
variant_required_fields:
  - file
  - role
optional_per_concrete_namespace:
  - locale_overrides
locale_override_fields:
  numbers: [numbering_system, digits, decimal_separator, group_separator, grouping_style]
  punctuation: [quote_start, quote_end, alt_quote_start, alt_quote_end]
  datetime: [date_field_order, calendar, hour_cycle]
constraints:
  language_tag: preferred_bcp47_form
  script: iso15924_four_letter_code
  variant_id: lowercase_letters_digits_hyphens
  project_language_code_equals_profile_namespace: true
  workflow_profile_selection: derived_from_bound_project
  workflow_level_grammar_bindings: prohibited
  target_profile_role: may_bind_GENERATED_TARGET_or_WIP
resolution:
  - project.language.profile
  - project.language.variant
  - workflow_binding_role_compatibility
