schema_id: sage-numbers-result-1.0
required: [schema_version, workflow, check_id, provenance, check_policy, model_receipts, limitations, groups, findings, coverage, summary, metrics]
controls:
  schema_version: '1.0'
  owner: system/src/sage/numbers/results.py
  workflow: nca
  check_id: NUMBERS
  checks: [number_accuracy, presentation_consistency, footnote_review]
  presentation_consistency: accepted_no_op
  group_required: [unit_id, western_references, target_references, extraction, comparison, limitations, notes]
  extraction_required: [status, limitations, values]
  comparison_required: [outcome, mode, authority, wip_values, expected_values, review_context]
  numeric_encoding: reduced_rational_strings
  comparison_modes: [ORDERED, UNORDERED]
  comparison_outcomes: [PASS, FAIL, NEEDS_REVIEW, NOT_ASSESSED]
  comparison_authority: [OL, NIV, NONE]
  needs_review_requires_review_context: true
  expected_unit_reconciliation: exactly_once
  finding_identity: run_global
  model_receipts: exact_phase_receipts
  required_phase: EXTRACTION
  mandatory_capability_limitation: required
  sqs_confidence_checks: not_applied
