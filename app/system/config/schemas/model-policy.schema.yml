schema_id: sage-model-policy-2.0
required:
  - schema_version
  - qualification_policy_version
  - unknown_route_status
  - accepted_operational_statuses
  - provisional_routing
  - recommendation_order
  - skill_routes
controls:
  schema_version: '2.0'
  route_key: exact_registered_skill_id
  qualification_evidence: external_hash_bound_receipt
  unknown_route_status: UNASSESSED
  accepted_operational_statuses:
    - RECOMMENDED
    - QUALIFIED
  provisional_routing:
    release_state_gate: required
    no_data_status: PROVISIONAL_UNQUALIFIED
    provider_native_reasoning: required
    known_negative_effect: BLOCK
    stale_evidence_effect: BLOCK
  availability_states:
    - AVAILABLE
    - UNAVAILABLE
  qualification_states:
    - RECOMMENDED
    - QUALIFIED
    - UNRELIABLE
    - FAILED
    - UNASSESSED
    - STALE
    - PROVISIONAL_UNQUALIFIED
  reasoning_order: provider_native
  universal_reasoning_scale: prohibited
  model_self_qualification: prohibited
