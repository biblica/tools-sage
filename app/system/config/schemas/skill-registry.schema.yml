schema_id: sage-skill-registry-2.0
required: [skills]
keying:
  skills: skill_id
skill_required:
  - workflow
  - operation
  - file
  - source_system
  - source_version
  - original_file
  - original_sha256
  - adapted_sha256
  - qualification_status
controls:
  file_extension: .md
  one_skill_per_enabled_operation: true
  source_traceability_required: true
  original_file_inside_workspace: true
  original_hash_verified: true
  adapted_hash_verified: true
  qualification_status: VALIDATED
  file_hashes_recorded_in_ACT_task: true
