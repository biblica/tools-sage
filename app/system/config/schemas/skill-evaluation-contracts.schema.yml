schema_id: sage-skill-evaluation-contracts-1.0
required:
  - schema_version
  - suite_family
  - qualification_policy_version
  - skills
skill_required:
  - suite_id
  - suite_version
  - suite_sha256
  - repetitions_per_case
  - execution_class
  - validator_id
  - required_semantic_success
  - disqualifying_behavior
  - cases
case_required:
  - case_id
  - case_kind
  - path
  - bundle_sha256
controls:
  schema_version: '1.0'
  exact_registered_skill_inventory: required
  repetitions_per_case: 3
  cases_per_skill: 3
  provider_calls_during_package_validation: prohibited
