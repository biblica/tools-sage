schema_id: sage-work-unit-manifest-1.2
required:
- schema_version
- plan_id
- plan_fingerprint
- workflow_id
- operation
- operator_scope
- project_id
- policy
- shared_hashes
- units
- summary
unit_required:
- unit_id
- primary_scope
- primary_references
- primary_coverage_atoms
- context_before
- context_after
- context_atoms
- measurement
- split_boundary
- split_boundary_marker
controls:
- every_requested_coordinate_in_exactly_one_primary_unit
- raw_source_spans_are_metadata_and_primary_coverage_atoms_are_authoritative
- rtc_boundaries_do_not_bisect_wip_reference_or_vrs_equivalence_spans
- no_context_only_coordinate_is_an_ordinary_finding_target
- final_serialized_packet_within_hard_limits
- ms1_ms2_s1_s2_are_section_boundary_candidates
- qa_and_b_are_poetry_block_boundary_candidates
- q_and_qm_lines_do_not_split_poetry_blocks
- m_continues_the_preceding_non_header_body_block
- m_starts_a_new_body_block_after_a_header_or_poetry_break
- s3_is_not_a_split_candidate_but_remains_a_structural_header
- chapter_boundary_is_a_weak_fallback
- plan_identity_is_content_addressed_by_resources_policies_grammar_vrs_and_structure
- generated_plan_artifacts_remain_inside_the_owning_workflow_output_root

alpha_controls:
  job_run_identity: canonical_job_id_and_run_id
  pre_release_migration: prohibited
