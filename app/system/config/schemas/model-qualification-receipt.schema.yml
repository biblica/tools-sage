schema_id: sage-model-qualification-receipt-1.0
required:
  - schema_version
  - provider
  - model_id
  - capability_fingerprint
  - reasoning_id
  - skill_id
  - skill_sha256
  - suite_id
  - suite_sha256
  - policy_version
  - qualification_status
  - case_count
  - repetitions_per_case
  - attempt_count
  - hard_failure_count
  - semantic_failure_count
  - attempts
  - created_utc
  - evidence_sha256
controls:
  schema_version: '1.0'
  qualification_statuses:
    - QUALIFIED
    - UNRELIABLE
    - FAILED
  case_repetitions: 3
  model_self_qualification: prohibited
