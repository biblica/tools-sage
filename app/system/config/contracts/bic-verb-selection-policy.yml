policy:
  id: BIC_PROTECTED_VERB_SELECTION_POLICY
  baseline: '2.00'
  status: PINNED
  semantic_authority_separation:
    semdom_role: CLASSIFICATION_AND_RETRIEVAL
    project_sense_role: CONTEXTUAL_LEXICAL_IDENTITY
    decision_index_role: TRANSLATION_AUTHORITY
    semdom_may_authorize_translation_choice: false
  semantic_gate:
    semantic_fidelity_precedes_accessibility: true
    familiarity_may_override_semantics: false
    required_preservation:
    - MEANING
    - SEMANTIC_FORCE
    - TONE
    - AGENCY
    - PARTICIPANT_RELATIONS
    - TENSE_ASPECT_MOOD
    - VOICE
    - REGISTER
    - DISCOURSE_FUNCTION
    - LEGITIMATE_AMBIGUITY
    - APPROVED_TERMINOLOGY
  familiarity_tie_break:
    rule: Among candidates that preserve meaning, force, register, and discourse function equally, prefer the more familiar wording.
    applies_only_after_semantic_gate: true
  ol_referral:
    minimum_semantic_risk: 2
    material_trigger_required: true
    lexical_difficulty_alone_is_trigger: false
    bounded_question_required: true
    bounded_scope_required: true
  completion:
    linguistic_uncertainty_blocks_rewrite: false
    risk_3_and_4_complete_with_recommended_candidate: true
    operator_input_during_rewrite: PROHIBITED
  alternatives:
    risk_2_max: 2
    risk_3_max: 3
    risk_4_max: 4
    material_alternatives_only: true
    rejection_reason_required_for_high_risk: true
    rejection_codes:
    - MEANING_LOSS
    - FORCE_WEAKENED
    - FORCE_INTENSIFIED
    - WRONG_SENSE
    - AGENCY_CHANGED
    - PARTICIPANT_RELATION_CHANGED
    - TAM_CHANGED
    - REGISTER_MISMATCH
    - AMBIGUITY_INTRODUCED
    - TERMINOLOGY_CONFLICT
    - LESS_ACCESSIBLE_WITH_NO_SEMANTIC_GAIN
    - OL_EVIDENCE_DISFAVOURS
    - OTHER_MATERIAL_LOSS
