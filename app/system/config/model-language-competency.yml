schema_version: '1.0'
policy:
  title: Registered LLM Language Competency Evidence
  operator_disclaimer: These tiers come from versioned release evidence or measured
    evaluations. Missing evidence is UNASSESSED; a model never rates itself.
  tiers:
  - EXCELLENT
  - GOOD
  - FAIR
  - UNASSESSED
  model_release_identity: provider_model_id
  provider_runtime_version_note: The provider CLI/runtime version is recorded separately.
    When the provider exposes no finer model revision, the provider model ID is the
    model release/version key.
  new_model_action: REQUIRE_VERSIONED_OR_MEASURED_EVIDENCE
  new_language_action: MARK_UNASSESSED_THEN_BUILD_PROFILE
  overwrite_policy: NEVER_OVERWRITE_OLDER_MODEL_RELEASES

