setup_guidance:
  canonical_surface: sage launcher guided setup
  normal_launch: ./sage
  windows_launch: .\sage.cmd
  setup_surface: TERMINAL_MENU
  provider_surface: SEALED_GOVERNED_TASK_ONLY
  manual_recalibration: Main menu option 5
  recovery_surface: Main menu option 7
ecosystem:
  schema_version: '0.04'
  id: sage
  name: Scripture Analysis and Generation Engine
  configured: false
interface:
  language: en-US
  menu_localization_source: system/config/localization/menu-localization.json
paths:
  internal_scripture_root: "@projects"
  base_vrs_root: system/resources/scripture
  cache_root: "@system/cache"
  runtime_state_root: "@system"
human_output:
  operator_language: en
  operator_language_policy:
    approved:
    - en
    candidates:
    - id
    - fr
    - es
    - pt-BR
    - pt-PT
    - ru
    operational_priorities:
    - id
    - fr
    pilot_only:
    - hi-Deva
    - th
    - fil
    - tl
    - sw
    - ha-Latn
  logs_and_reports:
    primary_language: OPERATOR_LANGUAGE
    secondary_language: null
    bilingual: false
    verbosity: normal
  translation_challenges:
    primary_language: OPERATOR_LANGUAGE
    secondary_language: null
    bilingual: false
    minimum_individual_urgency: 2
    aggregate_lower_levels: true
    consolidate_repeated_cause: true
    render_only_material_fields: true
  machine_records:
    language: canonical
    localise_codes: false
versification:
  canonical_file: org.vrs
  default_file: eng.vrs
  base_files:
  - eng.vrs
  - org.vrs
  custom_file_default: custom.vrs
