profile:
  schema_version: '2.0'
  id: bol-target
  language: en
  script: Latn
  role: TARGET
  status: PROJECT_REVIEW_REQUIRED
  purpose: generated_and_reviewed_target_support
  owner_role: OPERATOR
  last_reviewed: null
governance:
  authority: Operator-approved BOL style, grammar guidance, corpus evidence, and recorded review decisions
  automatic_approval: false
  unresolved_cases: REPORT_WITH_URGENCY
  reference_language_is_not_target_model: true
  source_language_form_is_not_target_form: true
evidence_priority:
- approved project decision or exception
- interpreted contemporary-source content in bounded context
- repeated accepted BOL target pattern
- relevant original-language evidence
- AI-generated hypothesis requiring review
normalization:
  unicode_form: NFC
  spelling_standard: BRITISH_OXFORD
  suffix_policy: OXFORD_IZE
  quotation_policy: PROJECT_DECISION_RECOMMENDED
  serial_comma_policy: PROJECT_DECISION_RECOMMENDED
  dash_policy: PROJECT_DECISION_RECOMMENDED
  punctuation_policy: PROJECT_DECISION_RECOMMENDED
checks:
- id: EN-BOL-GR-001
  dimension: participant_reference
  review: Check names, pronouns, understood subjects, and participant shifts for clarity and fidelity.
  caution: Do not add repeated names merely to mirror a reference rendering.
- id: EN-BOL-GR-002
  dimension: clause_relationships
  review: Check causal, inferential, contrastive, temporal, conditional, and subordinate relationships.
  caution: Restructuring is acceptable when the relationship and emphasis remain intact.
- id: EN-BOL-GR-003
  dimension: tense_aspect_modality
  review: Check tense, aspect, mood, modality, and sequence of events against the interpreted source.
  caution: Do not map one source-language form mechanically to one English tense.
- id: EN-BOL-GR-004
  dimension: voice_and_information_structure
  review: Check active/passive choices, topic–focus order, emphasis, and constituent placement.
  caution: Prefer natural English without erasing source-significant prominence.
- id: EN-BOL-GR-005
  dimension: agreement_and_reference
  review: Check subject–verb agreement, number, person, demonstratives, possessives, and antecedents.
  caution: Collective and coordinated subjects may permit more than one natural pattern.
- id: EN-BOL-GR-006
  dimension: negation_questions_commands
  review: Check negative scope, questions, commands, prohibitions, requests, and indirect speech acts.
  caution: Preserve force and politeness without importing source syntax.
- id: EN-BOL-GR-007
  dimension: lexical_sense_and_collocation
  review: Check that word sense, collocation, and idiom fit the bounded source meaning and target context.
  caution: Approved memory is sense-linked; do not apply a preferred word mechanically.
- id: EN-BOL-GR-008
  dimension: ambiguity
  review: Check whether grammar or word order creates a material ambiguity absent from the interpreted source.
  caution: Do not treat every theoretically possible alternate parse as actionable.
- id: EN-BOL-GR-009
  dimension: addition_omission_and_explication
  review: Check that no meaningful content is omitted, added, harmonised, or explained beyond the source.
  caution: Minimum sufficient restructuring is permitted; doctrinal clarification is not.
- id: EN-BOL-GR-010
  dimension: quotation_and_punctuation
  review: Check quotation boundaries, dialogue structure, punctuation, paragraphing, and source-significant capitalisation.
  caution: Preserve meaningful USFM payloads and apply approved project conventions.
- id: EN-BOL-GR-011
  dimension: naturalness_and_register
  review: Check contemporary English naturalness, accessibility, genre, and project register without weakening meaning.
  caution: Final audience acceptability and project style decisions require human review.
- id: EN-BOL-GR-012
  dimension: discourse_cohesion
  review: Check connectives, lexical cohesion, paragraph flow, and continuity across the bounded discourse.
  caution: Do not create explicit links when the interpreted source intentionally leaves a relation implicit.
- id: EN-BOL-GR-013
  dimension: spelling_and_word_formation
  review: Check British Oxford spelling, inflection, derivation, compounds, hyphenation, and consistent treatment
    of proper names and transliterations.
  caution: Do not modernise, respell, or standardise a project-approved form without recorded project authority.
- id: EN-BOL-GR-014
  dimension: sentence_structure_and_clause_load
  review: Check sentence boundaries, finite-clause structure, subordination, coordination, attachment, fragments,
    and run-on constructions for fidelity and readability.
  caution: Do not shorten or divide a sentence when doing so changes logical relationships, emphasis, quotation
    scope, or discourse flow.
- id: EN-BOL-GR-015
  dimension: determiners_and_noun_phrases
  review: Check articles, definiteness, countability, quantifiers, genitives, apposition, modifier attachment, and
    noun-phrase reference.
  caution: English determiners may require restructuring, but they must not add specificity or participant identity
    absent from the interpreted source.
- id: EN-BOL-GR-016
  dimension: prepositions_complements_and_valency
  review: Check prepositions, particles, complements, argument structure, phrasal verbs, and lexical valency in
    the bounded target context.
  caution: A familiar English construction is not automatically correct; preserve the interpreted participant roles
    and semantic relationship.
usage:
  initialization: Validate identity and project approval status only.
  inspect: Identify bounded translation challenges and possible memory proposals; do not draft TARGET Scripture.
  rewrite: Produce one bounded USFM candidate using approved memory and project grammar.
  self_check: Review the sealed rewrite candidate in a fresh context and correct only supported issues.
finding_requirements:
- Cite the exact bounded reference and relevant EN-BOL-GR rule IDs.
- Distinguish source-fidelity, grammar, style, punctuation, and naturalness concerns.
- Record unresolved ambiguity rather than silently resolving it.
- State when a final judgement requires human review.
- For spelling or syntax findings, cite the exact TARGET form and the relevant EN-BOL-GR rule ID.
- Distinguish mandatory correction from an unresolved project style decision.
restrictions:
- Do not add, omit, harmonise, or doctrinally clarify source content.
- Do not use a comparison text as translation authority.
- Do not apply memory outside its approved sense and conditions.
- Do not alter unlisted USFM markers or project files.
- Do not auto-approve project grammar decisions.
project_decisions: []
approved_exceptions: []
