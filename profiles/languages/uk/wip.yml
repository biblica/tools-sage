profile:
  schema_version: '2.0'
  language: uk
  script: Cyrl
  status: PROJECT_REVIEW_REQUIRED
  purpose: consultant_review_support
  owner_role: AL
  last_reviewed: null
  id: wip
  role: WIP
governance:
  authority: project-approved grammar guidance, corpus evidence, and recorded consultant decisions
  automatic_approval: false
  unresolved_cases: REPORT_WITH_URGENCY
  reference_language_is_not_target_model: true
  source_language_form_is_not_target_form: true
evidence_priority:
- recorded project decision or approved exception
- repeated acceptable WIP corpus pattern in equivalent contexts
- Ukrainian-language consultant or Area Linguist judgment
- descriptive Ukrainian grammar evidence
- AI-generated hypothesis requiring review
checks:
- id: UKR-GR-001
  dimension: agreement
  review: Check adjective, participle, pronoun, and predicate agreement for case, number, and gender where Ukrainian
    syntax requires it.
  caution: Apparent mismatch may be licensed by coordination, apposition, collective reference, or an implicit head.
- id: UKR-GR-002
  dimension: subject_verb_agreement
  review: Check finite-verb agreement and the treatment of coordinated, quantified, impersonal, and understood subjects.
  caution: Do not force overt English-style subjects or resolve allowed singular/plural variation automatically.
- id: UKR-GR-003
  dimension: case_and_government
  review: Check case government by verbs, prepositions, adjectives, nouns, and fixed constructions.
  caution: Lexical government and semantic role must be supported by Ukrainian evidence, not copied from REFERENCE
    order.
- id: UKR-GR-004
  dimension: numerals_and_quantification
  review: Check case/number patterns after cardinal numerals, collective numerals, quantities, and measure expressions.
  caution: Agreement can vary with syntax, animacy, and intended grouping; route disputed cases to human review.
- id: UKR-GR-005
  dimension: verbal_aspect_tense_and_voice
  review: Check whether aspect, tense, mood, voice, and reflexive forms preserve event structure and discourse function.
  caution: Do not equate one Greek/Hebrew verbal form mechanically with one Ukrainian tense or aspect.
- id: UKR-GR-006
  dimension: infinitive_participle_and_converb
  review: Check control, attachment, temporal relation, and naturalness of infinitives, participles, and adverbial
    participles.
  caution: Avoid calques that are formally possible but unnatural or ambiguous in contemporary Ukrainian.
- id: UKR-GR-007
  dimension: participant_reference
  review: Check pronoun antecedents, zero subjects, demonstratives, reflexives, possessives, and shifts between
    naming and pronominal reference.
  caution: Preserve legitimate discourse prominence and avoid adding names solely to mirror REFERENCE repetition.
- id: UKR-GR-008
  dimension: address_and_politeness
  review: Check vocative forms, singular/plural address, capitalization, and ти/ви choices against project policy
    and discourse relationships.
  caution: Register and capitalization are project/community decisions, not automatic grammatical corrections.
- id: UKR-GR-009
  dimension: negation_modality_questions_commands
  review: Check scope of negation, negative concord, particles, modal force, interrogatives, imperatives, prohibitions,
    and indirect commands.
  caution: A surface particle mismatch is not sufficient evidence of a meaning error.
- id: UKR-GR-010
  dimension: information_structure_and_word_order
  review: Check topic-focus order, contrast, emphasis, clitic/particle placement, and ambiguity created by constituent
    order.
  caution: Ukrainian word order is flexible; differences from English order are not findings by themselves.
- id: UKR-GR-011
  dimension: connective_relationships
  review: Check coordination, subordination, causal, inferential, adversative, concessive, temporal, and conditional
    relationships.
  caution: Zero connectives and restructuring may be acceptable when the relationship remains clear.
- id: UKR-GR-012
  dimension: lexical_syntactic_calque
  review: Identify unnatural government, nominalization, passive, clause chaining, or modifier placement apparently
    copied from REFERENCE form.
  caution: Confirm with Ukrainian corpus/project evidence before recommending change.
- id: UKR-GR-013
  dimension: euphony_and_form_variants
  review: Review у/в, і/й/та, з/із/зі and ся/сь choices where they materially affect fluency or project consistency.
  caution: Treat these primarily as style/orthography unless meaning, parsing, or readability is affected.
- id: UKR-GR-014
  dimension: naturalness_and_register
  review: Check contemporary Ukrainian idiom, genre, reverence/register, and accessibility for the project audience.
  caution: Final naturalness and community acceptability require qualified Ukrainian speakers.
- id: UKR-GR-015
  dimension: quotation_and_dialogue
  review: Check Ukrainian quotation marks, nested quotations, dialogue paragraphing, and speaker changes against
    project policy.
  caution: Do not apply English quotation conventions or move punctuation mechanically.
- id: UKR-GR-016
  dimension: punctuation_and_dash
  review: Check commas, colons, semicolons, ellipses, em dashes, dialogue dashes, and spacing where they affect
    parsing or project consistency.
  caution: Punctuation is partly stylistic; report only material or project-policy issues.
- id: UKR-GR-017
  dimension: apostrophe_and_orthography
  review: Check apostrophe forms, Ukrainian letter forms, capitalization, and orthographic consistency in the bounded
    text.
  caution: Do not normalize project-approved forms automatically.
- id: UKR-GR-018
  dimension: sentence_boundaries_and_clause_attachment
  review: Check sentence division, clause attachment, parenthesis, coordination, and subordination where punctuation
    or word order permits competing parses.
  caution: Do not revise a grammatically valid structure solely to match the contemporary reference; require a meaning,
    clarity, or project-policy reason.
usage:
  initialization: Validate language identity, schema, and approval status; do not run verse-level grammar checks.
  baseline_qa: Identify bounded evidence, corpus patterns, and review questions in the authorized scope.
  focused_check: Investigate one explicit grammatical concern using project and corpus evidence.
  original_language_review: Clarify source meaning only when materially relevant; do not prescribe Ukrainian form
    directly.
finding_requirements:
- Cite the exact WIP form and reference.
- State the suspected Ukrainian relationship, not merely the REFERENCE difference.
- Record supporting and contrary evidence.
- Distinguish grammar, style, orthography, and meaning risk.
- Route unconfirmed rules and naturalness judgments to the assigned human reviewer.
restrictions:
- Do not infer a project rule from one occurrence.
- Do not treat English REFERENCE grammar or word order as a model for Ukrainian form.
- Do not transfer Greek or Hebrew morphology directly into Ukrainian grammar.
- Do not auto-approve grammar decisions without project evidence or human review.
- Do not turn an optional style preference into a meaning finding.
project_decisions: []
approved_exceptions: []
normalization:
  unicode_form: NFC
  orthography_standard: PROJECT_DECISION_RECOMMENDED
  capitalisation_policy: PROJECT_DECISION_RECOMMENDED
  apostrophe_policy: PROJECT_DECISION_RECOMMENDED
  quotation_policy: PROJECT_DECISION_RECOMMENDED
  dash_policy: PROJECT_DECISION_RECOMMENDED
