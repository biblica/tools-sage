profile:
  schema_version: '2.0'
  id: wip
  language: fa
  script: Arab
  role: WIP
  status: PROJECT_REVIEW_REQUIRED
  purpose: consultant_review_support
  owner_role: AREA_LINGUIST
  last_reviewed: null
governance:
  authority: Project-approved Persian grammar guidance, corpus evidence, and recorded consultant decisions
  automatic_approval: false
  unresolved_cases: REPORT_WITH_URGENCY
  reference_language_is_not_target_model: true
  source_language_form_is_not_target_form: true
evidence_priority:
- recorded project decision or approved exception
- repeated acceptable WIP corpus pattern in equivalent contexts
- Persian-language consultant or Area Linguist judgement
- descriptive Persian grammar evidence
- AI-generated hypothesis requiring review
normalization:
  unicode_form: NFC
  preferred_characters:
    kaf: ک
    yeh: ی
  zwnj_policy: PROJECT_DECISION_RECOMMENDED
  digit_policy: PROJECT_DECISION_RECOMMENDED
  orthography_standard: PROJECT_DECISION_RECOMMENDED
  quotation_policy: PROJECT_DECISION_RECOMMENDED
  punctuation_policy: PROJECT_DECISION_RECOMMENDED
  capitalisation_policy: NOT_APPLICABLE_EXCEPT_LATIN_EMBEDS
checks:
- id: FA-GR-001
  dimension: unicode_and_character_forms
  review: Check Arabic/Persian character variants, combining marks, joining behaviour, and project-approved Unicode
    forms.
  caution: Do not replace characters automatically when the project has an established orthographic policy.
- id: FA-GR-002
  dimension: spacing_and_zwnj
  review: Check word spacing, half-space or ZWNJ use, affixes, compounds, and joining around punctuation.
  caution: ZWNJ conventions vary by project and publication system; report evidence rather than normalising silently.
- id: FA-GR-003
  dimension: ezafe_and_noun_phrases
  review: Check ezāfe relationships, adjective order, possessive relationships, apposition, and noun-phrase attachment.
  caution: Do not infer an ezāfe error solely from the written absence of an optional visible marker.
- id: FA-GR-004
  dimension: clitics_and_enclitic_pronouns
  review: Check attachment and referents of object, possessive, copular, and connective clitics.
  caution: Clitic placement interacts with register, emphasis, and written style; confirm the intended constituent.
- id: FA-GR-005
  dimension: agreement_and_person
  review: Check subject–verb agreement, animacy-sensitive plural agreement, person, number, and copular forms.
  caution: Formal and colloquial patterns differ; use the project register rather than a universal prescriptive
    rule.
- id: FA-GR-006
  dimension: tense_aspect_modality
  review: Check tense, aspect, mood, evidential force, modality, and auxiliary combinations against the intended
    event structure.
  caution: Do not map Greek, Hebrew, or English verbal forms mechanically to one Persian construction.
- id: FA-GR-007
  dimension: light_verbs_and_predicates
  review: Check light-verb constructions, compound predicates, valency, and selection of copular or verbal complements.
  caution: Lexical choice and naturalness require Persian corpus and project evidence.
- id: FA-GR-008
  dimension: participant_reference
  review: Check overt and omitted pronouns, antecedents, reflexives, demonstratives, honorific forms, and participant
    shifts.
  caution: Persian permits subject omission; do not add names or pronouns merely to mirror a reference text.
- id: FA-GR-009
  dimension: word_order_and_information_structure
  review: Check topic–comment organisation, focus, scrambling, modifier placement, and ambiguity caused by constituent
    order.
  caution: Differences from English word order are not findings unless they affect meaning, clarity, or project
    style.
- id: FA-GR-010
  dimension: relative_and_subordinate_clauses
  review: Check relative clauses, complement clauses, conditionals, temporal clauses, and the scope of subordinators.
  caution: Restructuring is acceptable when logical relationships and discourse prominence remain clear.
- id: FA-GR-011
  dimension: negation_questions_commands
  review: Check negative scope, negative concord, interrogatives, imperatives, prohibitions, and indirect commands.
  caution: A particle difference alone does not establish a meaning error.
- id: FA-GR-012
  dimension: connectives_and_discourse
  review: Check causal, inferential, adversative, concessive, sequential, and explanatory relationships across clauses.
  caution: Persian may leave some relations implicit; assess whether the intended relation remains recoverable.
- id: FA-GR-013
  dimension: punctuation_and_quotation
  review: Check Persian punctuation, quotation marks, dialogue layout, terminal punctuation, and spacing around
    signs.
  caution: Apply the project’s publication conventions and do not import English punctuation mechanically.
- id: FA-GR-014
  dimension: register_naturalness_and_calque
  review: Check contemporary Persian naturalness, audience register, idiom, and possible calques from the contemporary
    source.
  caution: Final naturalness and community acceptability require qualified Persian speakers.
- id: FA-GR-015
  dimension: sentence_boundaries_and_clause_attachment
  review: Check sentence division, clause attachment, parenthetical structure, coordination, and subordination where
    punctuation or connective choice permits competing parses.
  caution: Do not restructure a valid Persian sentence solely to mirror the contemporary source; require evidence
    of meaning, clarity, or project-policy impact.
usage:
  initialization: Validate language identity, schema, and approval status; do not perform verse-level grammar review.
  baseline_qa: Identify bounded evidence, corpus patterns, and review questions in the authorised scope.
  focused_check: Investigate one explicit Persian grammar or orthography concern.
  original_language_review: Clarify source meaning only when materially relevant; do not prescribe Persian form
    directly.
finding_requirements:
- Cite the exact WIP form and reference.
- Cite one or more FA-GR rule IDs for a grammar finding.
- Record supporting and contrary evidence.
- Distinguish grammar, orthography, style, and meaning risk.
- Route unconfirmed rules and naturalness judgements to the assigned human reviewer.
restrictions:
- Do not infer a project rule from one occurrence.
- Do not treat the contemporary source grammar or word order as the Persian model.
- Do not transfer Greek or Hebrew morphology directly into Persian grammar.
- Do not normalise characters, ZWNJ, digits, or punctuation without project authority.
- Do not auto-approve grammar decisions.
project_decisions: []
approved_exceptions: []
