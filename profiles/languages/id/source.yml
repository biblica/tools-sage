profile:
  schema_version: '2.0'
  id: source
  language: id
  script: Latn
  role: CONTENT_SOURCE
  status: ACTIVE
  purpose: source_analysis_support
  owner_role: OPERATOR
  last_reviewed: null
governance:
  authority: Operator-approved project guidance, source corpus evidence, and recorded specialist decisions
  automatic_approval: false
  unresolved_cases: REPORT_WITH_URGENCY
normalization:
  unicode_form: NFC
  case_significant: true
  whitespace_significant: false
checks:
- id: ID-GR-001
  dimension: word_boundaries
  review: Preserve meaningful Indonesian word, clitic, hyphen, and reduplication boundaries during source analysis.
  caution: Do not infer a source-language rule from one spelling or occurrence.
- id: ID-GR-002
  dimension: participant_reference
  review: Track explicit, implicit, and shifted participant reference within the bounded discourse context.
  caution: Indonesian zero subjects and discourse continuity require contextual review.
- id: ID-GR-003
  dimension: clause_relationships
  review: Identify coordination, subordination, cause, result, contrast, condition, and temporal relationships relevant
    to interpretation.
  caution: A surface conjunction is evidence, not a complete semantic decision.
- id: ID-GR-004
  dimension: voice_and_valency
  review: Check active, passive, applicative, causative, and valency relationships expressed by morphology and syntax.
  caution: Do not reduce Indonesian voice choices to English active/passive labels.
- id: ID-GR-005
  dimension: aspect_modality_and_negation
  review: Identify aspectual particles, modality, negation, prohibitions, and their scope.
  caution: Particle meaning depends on construction and discourse context.
- id: ID-GR-006
  dimension: noun_phrase_relationships
  review: Check possession, modification, apposition, quantification, classifiers, and relative constructions.
  caution: Indonesian noun-phrase order should be interpreted on its own terms.
- id: ID-GR-007
  dimension: lexical_sense
  review: Distinguish contextually supported senses, idioms, collocations, and terminology candidates.
  caution: Do not convert a recurring form into approved memory without operator review.
- id: ID-GR-008
  dimension: discourse_and_information_structure
  review: Track topic, focus, foregrounding, repetition, ellipsis, and paragraph-level cohesion.
  caution: Do not add explicit links solely because the target language may prefer them.
- id: ID-GR-009
  dimension: ambiguity
  review: Record genuine lexical or grammatical ambiguity that affects the rewrite decision.
  caution: Preserve unresolved ambiguity unless authorised evidence resolves it.
- id: ID-GR-010
  dimension: source_authority_and_markers
  review: Treat the complete bounded source content and meaningful USFM marker payloads as authoritative input.
  caution: Do not use reference wording to add, omit, harmonise, or clarify the source.
- id: ID-GR-011
  dimension: orthography_and_tokenisation
  review: Check spelling, affix boundaries, clitics, reduplication, compounds, abbreviations, and tokenisation when
    they affect source interpretation.
  caution: Record uncertain or non-standard forms as evidence; do not silently normalise the LOCKED source.
- id: ID-GR-012
  dimension: punctuation_quotation_and_sentence_boundaries
  review: Check punctuation, quotation structure, paragraphing, and sentence boundaries when they affect attachment,
    speaker identity, or discourse relationships.
  caution: Punctuation is interpretive evidence, not independent authority; reconcile it with syntax, discourse,
    and meaningful USFM markers.
project_decisions: []
approved_exceptions: []
