[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tools-sage-sqs"
version = "0.02a1"
requires-python = ">=3.12"
dependencies = ["cryptography", "fastapi", "pydantic", "PyYAML", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sqs-admin = "sage_sqs.admin:main"
sqs-worker = "sage_sqs.worker:main"
sqs-publish = "sage_sqs.publisher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
