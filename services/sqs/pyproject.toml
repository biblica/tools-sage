[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tools-sage-sqs"
version = "0.02a1"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "jsonschema==4.26.0",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
# httpx2 is required transitively by starlette.testclient (used via fastapi.testclient
# in several tests); not needed at runtime, only for the test suite.
dev = ["pytest==9.1.1", "httpx2==2.13.0"]

[project.scripts]
sqs-admin = "sage_sqs.admin:main"
sqs-worker = "sage_sqs.worker:main"
sqs-publish = "sage_sqs.publisher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
