notes:
- Provider hierarchy and price are planning priors, never qualification evidence.
- A model must be ADMIN-approved before SQS evaluates or publishes it.
- SAGE reaches these models through the claude_workspace channel (the Claude Code CLI with each
  Operator's own subscription); dollar costs are list prices and only rank candidates there.
- pack_token_scale is the median Claude/o200k token ratio on Scripture measured 2026-10-22 for
  claude-opus-5-5 and claude-sonnet-5-5 (identical); for claude-haiku-5-5 and claude-fable-5-1 it is
  assumed, not measured.
