terms:
  operation: Public workflow action requested by the Operator.
  pass: One isolated model-analysis pass inside an operation.
  task: One governed runtime unit executed through the provider-neutral sealed task
    interface.
  scope: Operator-requested Scripture coordinate range.
  work_unit: Internal bounded subdivision of a scope.
  packet: Exact serialized evidence supplied to one pass or task.
  context_only: Evidence routed for interpretation but excluded from ordinary finding
    locations.
  equivalence_group: Resource-local coordinates that map to the same canonical semantic
    span.
  action: Human decision or edit required.
  finding: Supported QA conclusion, primarily used by SAW.
  challenge: Translation difficulty or unresolved decision, primarily used by BIC.
  memory: Durable Operator-governed relational knowledge.
  language_profile: Canonical language-code namespace selected by a project.
  profile_variant: Optional role-specific guidance selected inside a language profile.
  grammar_contract: Content-addressed compact rules derived from the project-selected
    language-profile variant.
  target_generation: Immutable committed BIC publication selected by exact generation
    ID.
  derived_output: Reproducible generated data that is not authority.
  content_state: 'Explicit trust and mutability flag: LOCKED or UNDER_REVIEW; never
    inferred.'
  project_role: Explicit authorized project use declared in scope.roles; never inferred.
boundaries:
  one_ecosystem: true
  one_resource_registry: true
  separate_workflow_states: true
  separate_workflow_locks: true
  separate_workflow_outputs: true
  shared_writable_target_folder: false
  saw_target_write_permission: false
  direct_saw_to_bic_memory_write: false
  custom_vrs_centralization: false
