schema_id: sage-llm-execution-receipt-1.2
required:
  - schema_version
  - task_id
  - execution_mode
  - provider
  - model
  - reasoning_effort
  - selection_mode
  - operator_policy_override
  - model_policy
  - started_utc
  - completed_utc
  - phase_count
  - phase_reasoning_efforts
  - conditional_evidence_used
  - conditional_ol_micro_scopes
  - prompt_sha256
  - final_prompt_sha256
  - handoff_measurements
  - response_sha256
  - output_sha256
  - policy
constraints:
  execution_mode: SAGE_GOVERNED_TASK_V1
  provider: [codex, ollama, lmstudio]
  openai_api_keys: PROHIBITED
  sage_workspace_exposed_as_provider_cwd: false
  provider_filesystem_writes: false
  model_web_access_as_task_evidence: false
  output_paths: exact_task_allowlist
  codex_live_catalog_source: app_server_model_list
  codex_auth_source: app_server_account_read
  codex_required_auth: CHATGPT
  operator_policy_override_must_be_recorded: true
  maximum_supported_reasoning_effort: xhigh
  unsupported_reasoning_efforts_are_filtered_and_cannot_be_overridden: true

provider_handoff_budget:
  estimator: SAGE_MULTILINGUAL_HEURISTIC_1
  measurement_scope: provider_prompt_plus_output_schema
  enforcement: immediately_before_each_provider_execute
conditional_ol_transport:
  bic_rewrite: one_material_challenge_per_phase
  scripture_micro_scope: one_single_verse
  verb_choice_question: verbal_sense_or_function_only
  automatic_surrounding_context: prohibited
