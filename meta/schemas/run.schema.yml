schema_id: sage-run-1.0
required:
- schema_version
- run_id
- tool
- job_id
- operation
- scope
- status
- current_stage
- task_manifests
- created_utc
- updated_utc
controls:
  schema_version: '1.0'
  ownership: tool_then_job_id_then_run_id
  scope: one_bounded_operator_goal
  task_manifests: immutable_task_paths_inside_run
  plan_path: optional_partition_plan_inside_run
  cross_job_task_paths: prohibited
  active_run_pointer: job_local_runtime_state
  release_candidate_migration: prohibited
