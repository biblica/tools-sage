schema_id: sage-original-language-resources-1.0
required: [schema_version, resources]
controls:
  schema_version: '1.0'
  owner: operator_state
  path: state/original-language-resources.json
  aliases:
    GRK:
      operator_alias: '@GRK'
      language: grc
      bundled_path: resources/scripture/original-language/grk
    HEB:
      operator_alias: '@HEB'
      language: hbo
      bundled_path: resources/scripture/original-language/heb
  source_types: [BUNDLED, PARATEXT, LOCAL]
  default_source: BUNDLED
  read_only: true
  ordinary_sage_project_inventory: false
  automatic_paratext_patterns: [grcSRCv#, hboSRCv#]
  automatic_override: false
